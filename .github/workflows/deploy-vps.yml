name: Deploy VPS

on:
  push:
    branches:
      - feature/self-host
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 66.23.224.231
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/apps/tasty-banana-v2
            bash deploy.sh
